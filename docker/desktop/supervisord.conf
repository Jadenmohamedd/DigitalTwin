[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_DESKTOP_WIDTH)sx%(ENV_DESKTOP_HEIGHT)sx24 -ac +extension GLX +render -noreset -nolisten tcp
priority=10
autorestart=unexpected
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/local/bin/twinx-display-run /usr/bin/dbus-run-session -- /usr/bin/openbox-session
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:panel]
command=/usr/local/bin/twinx-display-run /usr/bin/tint2
priority=20
autorestart=unexpected
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vnc]
command=/usr/local/bin/twinx-display-run /usr/bin/x11vnc -display :0 -rfbauth /home/twin/.vnc/passwd -listen 127.0.0.1 -rfbport 5900 -forever -shared -xkb -noxdamage
priority=30
autorestart=unexpected
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=/usr/bin/websockify --web /usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=unexpected
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:rviz]
command=/usr/local/bin/twinx-rviz
priority=50
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
